<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LINEARX Web — Motor de Álgebra Lineal</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js para gráficos -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#121212',
                        darkPanel: '#1e1e1e',
                        darkBorder: '#333333'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darkBg text-gray-100 font-sans min-h-screen flex flex-col">

    <!-- Header Principal -->
    <header class="bg-darkPanel border-b border-darkBorder px-6 py-4 flex justify-between items-center shadow-md">
        <div class="flex items-center space-x-3">
            <div class="bg-blue-600 text-white font-bold p-2 rounded-lg text-lg">LX</div>
            <h1 class="text-xl font-extrabold tracking-wide">LINEARX Engine <span class="text-xs text-blue-400 font-normal px-2 py-0.5 bg-blue-950 border border-blue-800 rounded">Web Edition</span></h1>
        </div>
        <button onclick="toggleTheme()" class="bg-darkBorder hover:bg-gray-700 text-xs font-semibold px-3 py-1.5 rounded-lg transition">
            🌙 Cambiar Tema
        </button>
    </header>

    <!-- Barra de Navegación por Pestañas -->
    <nav class="bg-darkPanel border-b border-darkBorder px-6 flex space-x-2 overflow-x-auto">
        <button onclick="switchTab('vectores')" class="tab-btn py-3 px-4 text-sm font-medium border-b-2 border-blue-500 text-blue-400 whitespace-nowrap">Vectores</button>
        <button onclick="switchTab('matrices')" class="tab-btn py-3 px-4 text-sm font-medium border-b-2 border-transparent text-gray-400 hover:text-gray-200 whitespace-nowrap">Matrices</button>
        <button onclick="switchTab('inversa')" class="tab-btn py-3 px-4 text-sm font-medium border-b-2 border-transparent text-gray-400 hover:text-gray-200 whitespace-nowrap">Inversa de Matriz</button>
        <button onclick="switchTab('determinantes')" class="tab-btn py-3 px-4 text-sm font-medium border-b-2 border-transparent text-gray-400 hover:text-gray-200 whitespace-nowrap">Determinantes</button>
        <button onclick="switchTab('ecuaciones')" class="tab-btn py-3 px-4 text-sm font-medium border-b-2 border-transparent text-gray-400 hover:text-gray-200 whitespace-nowrap">Ecuaciones (Ax=b)</button>
        <button onclick="switchTab('biseccion')" class="tab-btn py-3 px-4 text-sm font-medium border-b-2 border-transparent text-gray-400 hover:text-gray-200 whitespace-nowrap">Bisección</button>
        <button onclick="switchTab('romanos')" class="tab-btn py-3 px-4 text-sm font-medium border-b-2 border-transparent text-gray-400 hover:text-gray-200 whitespace-nowrap">Números Romanos</button>
    </nav>

    <!-- Contenedor Principal -->
    <main class="flex-1 p-6 max-w-7xl mx-auto w-full grid grid-cols-1 lg:grid-cols-2 gap-6">

        <!-- Panel de Configuración e Inputs -->
        <div class="bg-darkPanel border border-darkBorder rounded-xl p-5 flex flex-col shadow-lg">
            <h2 id="panel-title" class="text-lg font-bold mb-4 border-b border-darkBorder pb-2 text-blue-400">Módulo Vectores</h2>
            
            <div id="module-inputs" class="space-y-4 flex-1">
                <!-- Se inyecta dinámicamente -->
            </div>

            <button onclick="ejecutarCalculo()" class="mt-6 w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-lg transition shadow">
                ⚡ Calcular Operación
            </button>
        </div>

        <!-- Panel de Resultados, Gráficos y Logs -->
        <div class="bg-darkPanel border border-darkBorder rounded-xl p-5 flex flex-col shadow-lg space-y-4">
            <div class="flex justify-between items-center border-b border-darkBorder pb-2">
                <h3 class="text-sm font-bold text-gray-400 uppercase tracking-wider">Consola y Visualización</h3>
                <button onclick="copiarResultado()" class="text-xs bg-darkBorder hover:bg-gray-700 px-3 py-1 rounded transition">📋 Copiar Consola</button>
            </div>
            
            <!-- Canvas de Gráfica (Solo visible en Bisección) -->
            <div id="chart-wrapper" class="hidden bg-darkBg border border-darkBorder rounded-lg p-3 relative h-64">
                <canvas id="biseccionChart"></canvas>
            </div>

            <div id="result-container" class="flex-1 bg-black/40 border border-darkBorder rounded-lg p-4 font-mono text-xs overflow-auto max-h-[350px] whitespace-pre-wrap text-green-400">
                Esperando ejecución de datos...
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-darkPanel border-t border-darkBorder px-6 py-2.5 text-xs text-gray-400 flex justify-between items-center">
        <span>LINEARX Backend Core Activo (Python Engine)</span>
        <span id="ram-status" class="text-blue-400">📊 RAM del Sistema: Monitoreo activo</span>
    </footer>

    <!-- Lógica Frontend -->
    <script>
        let currentTab = 'vectores';
        let myChart = null;

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('border-blue-500', 'text-blue-400');
                btn.classList.add('border-transparent', 'text-gray-400');
            });
            event.target.classList.remove('border-transparent', 'text-gray-400');
            event.target.classList.add('border-blue-500', 'text-blue-400');

            // Mostrar u ocultar contenedor de gráfico
            const chartWrapper = document.getElementById('chart-wrapper');
            if (tab === 'biseccion') {
                chartWrapper.classList.remove('hidden');
            } else {
                chartWrapper.classList.add('hidden');
                if (myChart) { myChart.destroy(); myChart = null; }
            }

            renderInputs();
        }

        function renderInputs() {
            const title = document.getElementById('panel-title');
            const container = document.getElementById('module-inputs');
            container.innerHTML = '';

            if (currentTab === 'vectores') {
                title.innerText = "Módulo Vectores";
                container.innerHTML = `
                    <div><label class="block text-xs font-semibold mb-1">Operación:</label>
                    <select id="vec-op" class="w-full bg-darkBg border border-darkBorder rounded p-2 text-sm">
                        <option value="suma">Suma (u + v)</option><option value="resta">Resta (u - v)</option><option value="escalar">Escalar (k · v)</option>
                    </select></div>
                    <div class="grid grid-cols-2 gap-4">
                        <div><label class="block text-xs mb-1">Vector u:</label><input type="text" id="vec-u" value="1, 2, 3" class="w-full bg-darkBg border border-darkBorder rounded p-2 text-sm"></div>
                        <div><label class="block text-xs mb-1">Vector v / k:</label><input type="text" id="vec-v" value="4, 5, 6" class="w-full bg-darkBg border border-darkBorder rounded p-2 text-sm"></div>
                    </div>`;
            } else if (currentTab === 'matrices') {
                title.innerText = "Módulo Matrices";
                container.innerHTML = `
                    <div><label class="block text-xs font-semibold mb-1">Operación:</label>
                    <select id="mat-op" class="w-full bg-darkBg border border-darkBorder rounded p-2 text-sm">
                        <option value="suma">Suma (A + B)</option><option value="resta">Resta (A - B)</option><option value="multiplicacion">Multiplicación (A · B)</option><option value="escalar">Escalar (k · A)</option>
                    </select></div>
                    <div><label class="block text-xs mb-1">Matriz A (; filas):</label><textarea id="mat-a" rows="3" class="w-full bg-darkBg border border-darkBorder rounded p-2 text-sm font-mono">1,2; 3,4</textarea></div>
                    <div><label class="block text-xs mb-1">Matriz B / k:</label><textarea id="mat-b" rows="3" class="w-full bg-darkBg border border-darkBorder rounded p-2 text-sm font-mono">5,6; 7,8</textarea></div>`;
            } else if (currentTab === 'inversa') {
                title.innerText = "Inversa por Gauss-Jordan";
                container.innerHTML = `
                    <div><label class="block text-xs mb-1">Matriz A:</label><textarea id="inv-a" rows="4" class="w-full bg-darkBg border border-darkBorder rounded p-2 text-sm font-mono">1,2,3; 0,1,4; 5,6,0</textarea></div>
                    <div class="flex items-center space-x-2"><input type="checkbox" id="inv-pasos" checked class="rounded bg-darkBg border-darkBorder"> <label class="text-xs">Mostrar paso a paso</label></div>`;
            } else if (currentTab === 'determinantes') {
                title.innerText = "Cálculo de Determinantes";
                container.innerHTML = `
                    <div><label class="block text-xs font-semibold mb-1">Método:</label>
                    <select id="det-metodo" class="w-full bg-darkBg border border-darkBorder rounded p-2 text-sm">
                        <option value="lu">Descomposición LU</option><option value="cofactores">Cofactores</option><option value="sarrus">Sarrus (2x2 o 3x3)</option>
                    </select></div>
                    <div><label class="block text-xs mb-1">Matriz A:</label><textarea id="det-a" rows="4" class="w-full bg-darkBg border border-darkBorder rounded p-2 text-sm font-mono">2,1,3; 1,0,2; 4,1,5</textarea></div>`;
            } else if (currentTab === 'ecuaciones') {
                title.innerText = "Sistemas de Ecuaciones (Ax = b)";
                container.innerHTML = `
                    <div><label class="block text-xs font-semibold mb-1">Método:</label>
                    <select id="ec-metodo" class="w-full bg-darkBg border border-darkBorder rounded p-2 text-sm">
                        <option value="gauss">Gauss-Jordan</option><option value="cramer">Cramer</option>
                    </select></div>
                    <div><label class="block text-xs mb-1">Matriz A:</label><textarea id="ec-a" rows="3" class="w-full bg-darkBg border border-darkBorder rounded p-2 text-sm font-mono">2,1; 1,3</textarea></div>
                    <div><label class="block text-xs mb-1">Vector b:</label><input type="text" id="ec-b" value="5, 7" class="w-full bg-darkBg border border-darkBorder rounded p-2 text-sm"></div>`;
            } else if (currentTab === 'biseccion') {
                title.innerText = "Método Numérico de Bisección";
                container.innerHTML = `
                    <div><label class="block text-xs mb-1">Función f(x):</label><input type="text" id="bis-expr" value="x**3 - 4*x - 9" class="w-full bg-darkBg border border-darkBorder rounded p-2 text-sm"></div>
                    <div class="grid grid-cols-3 gap-2">
                        <div><label class="block text-xs mb-1">a inicial:</label><input type="text" id="bis-a" value="2.0" class="w-full bg-darkBg border border-darkBorder rounded p-2 text-sm"></div>
                        <div><label class="block text-xs mb-1">b inicial:</label><input type="text" id="bis-b" value="3.0" class="w-full bg-darkBg border border-darkBorder rounded p-2 text-sm"></div>
                        <div><label class="block text-xs mb-1">Tolerancia:</label><input type="text" id="bis-tol" value="0.0001" class="w-full bg-darkBg border border-darkBorder rounded p-2 text-sm"></div>
                    </div>`;
            } else if (currentTab === 'romanos') {
                title.innerText = "Números Romanos";
                container.innerHTML = `
                    <div><label class="block text-xs font-semibold mb-1">Modo:</label>
                    <select id="rom-modo" class="w-full bg-darkBg border border-darkBorder rounded p-2 text-sm">
                        <option value="r2a">Romano a Arábigo</option><option value="a2r">Arábigo a Romano</option>
                    </select></div>
                    <div><label class="block text-xs mb-1">Valor:</label><input type="text" id="rom-val" value="XIV" class="w-full bg-darkBg border border-darkBorder rounded p-2 text-sm"></div>`;
            }
        }

        async function ejecutarCalculo() {
            let payload = { modulo: currentTab };

            if (currentTab === 'vectores') {
                payload.op = document.getElementById('vec-op').value;
                payload.u = document.getElementById('vec-u').value.split(',').map(Number);
                payload.v = document.getElementById('vec-v').value.split(',').map(Number);
                if (payload.op === 'escalar') payload.k = parseFloat(payload.v[0]);
            } else if (currentTab === 'matrices') {
                payload.op = document.getElementById('mat-op').value;
                payload.A = document.getElementById('mat-a').value.split(';').map(r => r.split(',').map(Number));
                if (payload.op === 'escalar') {
                    payload.k = parseFloat(document.getElementById('mat-b').value);
                } else {
                    payload.B = document.getElementById('mat-b').value.split(';').map(r => r.split(',').map(Number));
                }
            } else if (currentTab === 'inversa') {
                payload.A = document.getElementById('inv-a').value.split(';').map(r => r.split(',').map(Number));
                payload.pasos = document.getElementById('inv-pasos').checked;
            } else if (currentTab === 'determinantes') {
                payload.metodo = document.getElementById('det-metodo').value;
                payload.A = document.getElementById('det-a').value.split(';').map(r => r.split(',').map(Number));
            } else if (currentTab === 'ecuaciones') {
                payload.metodo = document.getElementById('ec-metodo').value;
                payload.A = document.getElementById('ec-a').value.split(';').map(r => r.split(',').map(Number));
                payload.b = document.getElementById('ec-b').value.split(',').map(Number);
            } else if (currentTab === 'biseccion') {
                payload.expr = document.getElementById('bis-expr').value;
                payload.a = parseFloat(document.getElementById('bis-a').value);
                payload.b = parseFloat(document.getElementById('bis-b').value);
                payload.tol = parseFloat(document.getElementById('bis-tol').value);
            } else if (currentTab === 'romanos') {
                payload.modo = document.getElementById('rom-modo').value;
                payload.val = document.getElementById('rom-val').value;
            }

            try {
                const response = await fetch('/api/calcular/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const res = await response.json();
                
                const box = document.getElementById('result-container');
                if (res.status === 'ok') {
                    box.innerText = res.log || JSON.stringify(res.resultado || res, null, 2);

                    // Si es bisección y hay datos gráficos, renderizar gráfica
                    if (currentTab === 'biseccion' && res.grafica) {
                        renderizarGraficaBiseccion(res.grafica);
                    }
                } else {
                    box.innerText = "❌ ERROR: " + res.message;
                }
            } catch (err) {
                document.getElementById('result-container').innerText = "❌ Error de conexión: " + err;
            }
        }

        function renderizarGraficaBiseccion(dataGrafica) {
            const ctx = document.getElementById('biseccionChart').getContext('2d');
            if (myChart) { myChart.destroy(); }

            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    datasets: [
                        {
                            label: 'f(x)',
                            data: dataGrafica.puntos,
                            borderColor: '#3b82f6',
                            backgroundColor: 'rgba(59, 130, 246, 0.1)',
                            borderWidth: 2,
                            pointRadius: 1,
                            tension: 0.2
                        },
                        {
                            label: 'Raíz Hallada',
                            data: [dataGrafica.raiz],
                            backgroundColor: '#ef4444',
                            borderColor: '#ef4444',
                            pointRadius: 6,
                            pointStyle: 'star'
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: { type: 'linear', position: 'bottom', grid: { color: '#333' }, ticks: { color: '#aaa' } },
                        y: { grid: { color: '#333' }, ticks: { color: '#aaa' } }
                    },
                    plugins: { legend: { labels: { color: '#fff', font: { size: 10 } } } }
                }
            });
        }

        function copiarResultado() {
            navigator.clipboard.writeText(document.getElementById('result-container').innerText);
            alert("Consola copiada.");
        }

        function toggleTheme() { document.documentElement.classList.toggle('dark'); }

        renderInputs();
    </script>
</body>
</html>
